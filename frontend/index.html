<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>Torberry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="login-page" class="login-page">
        <section class="login-panel">
            <div class="brand-mark" aria-hidden="true">TB</div>
            <h1>Torberry</h1>
            <p class="login-copy">Sign in to manage your downloads.</p>
            <form id="login-form">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required>
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                <button class="button button-primary button-wide" type="submit">Sign in <span aria-hidden="true">→</span></button>
                <p id="login-error" class="form-error" role="alert"></p>
            </form>
        </section>
        <div class="login-glow" aria-hidden="true"></div>
    </main>

    <main id="main-page" class="app-shell hidden">
        <header class="topbar">
            <a class="brand" href="#" aria-label="Torberry home">Torberry</a>
            <div class="topbar-actions">
                <div class="connection-status"><span class="status-dot"></span><span>Connected</span></div>
                <button class="button button-ghost" id="logout-button" type="button">Sign out</button>
            </div>
        </header>

        <div class="content">
            <section class="page-heading">
                <div>
                    <h1>Downloads</h1>
                    <p class="muted">Manage torrents on this device.</p>
                </div>
                <div class="system-status" aria-label="System status">
                    <div class="system-stat"><span class="stat-label">CPU</span><strong id="cpu">—</strong></div>
                    <div class="system-stat"><span class="stat-label">RAM</span><strong id="ram">—</strong></div>
                    <div class="system-stat"><span class="stat-label">FREE DISK</span><strong id="disk">—</strong></div>
                </div>
            </section>

            <section class="add-panel">
                <div class="section-title"><div><h2>Add torrent</h2><p>Paste a magnet link or choose a torrent file.</p></div></div>
                <div class="add-controls">
                    <form id="magnet-form" class="magnet-form">
                        <label class="sr-only" for="magnet-input">Magnet link</label>
                        <input type="url" id="magnet-input" placeholder="magnet:?xt=urn:btih:..." autocomplete="off">
                        <button class="button button-primary" type="submit">Add magnet</button>
                    </form>
                    <div class="divider"><span>or</span></div>
                    <label class="file-picker button button-secondary" for="torrent-file">Choose file</label>
                    <input type="file" id="torrent-file" accept=".torrent" hidden>
                </div>
                <p id="add-error" class="form-error" role="alert"></p>
            </section>

            <section class="library-section">
                <div class="library-heading">
                    <div class="section-title"><div><h2>All torrents</h2><p id="library-summary">Loading…</p></div></div>
                    <button class="button button-ghost" id="refresh-button" type="button">Refresh</button>
                </div>
                <div id="torrent-list" class="torrent-list" aria-live="polite"></div>
            </section>
        </div>
        <div id="toast" class="toast" role="status"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
